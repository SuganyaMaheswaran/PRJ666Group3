apiVersion: apps/v1
kind: Deployment
metadata:
  name: settlecan-backend
  labels:
    app: settlecan-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: settlecan-backend
  template:
    metadata:
      labels:
        app: settlecan-backend
    spec:
      containers:
        - name: backend
          image: settlecan-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              value: "5000"
          envFrom:
            - secretRef:
                name: settlecan-backend-secrets
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "150m"
              memory: "128Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 100 # backend/Dockerfile's "nonroot" system user (adduser -S)
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 20
      securityContext:
        runAsNonRoot: true
