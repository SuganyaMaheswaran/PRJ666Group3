apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: settlecan-backend-canary
  labels:
    app: settlecan-backend-canary
spec:
  replicas: 4
  selector:
    matchLabels:
      app: settlecan-backend-canary
  template:
    metadata:
      labels:
        app: settlecan-backend-canary
    spec:
      containers:
        - name: settlecan-backend
          image: settlecan-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          envFrom:
            - secretRef:
                name: settlecan-backend-secrets
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "150m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
  strategy:
    canary:
      steps:
        - setWeight: 25
        - pause: {}
        - setWeight: 50
        - pause: {duration: 30}
        - setWeight: 75
        - pause: {duration: 30}
        - setWeight: 100
---
apiVersion: v1
kind: Service
metadata:
  name: settlecan-backend-canary
spec:
  selector:
    app: settlecan-backend-canary
  ports:
    - port: 80
      targetPort: 5000